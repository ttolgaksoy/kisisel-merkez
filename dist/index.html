<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1018">
  <meta name="description" content="Görev, spor, uyku ve bütçe planlarını tek yerde tutan kişisel merkez.">
  <title>Kişisel Merkez</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.svg">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div>
        <p class="eyebrow" id="header-eyebrow"></p>
        <h1 id="header-title">Kişisel Merkez</h1>
      </div>
      <button class="icon-button avatar" id="settings-button" type="button" aria-label="Ayarları aç">
        <span id="avatar-letter">T</span>
      </button>
    </header>

    <main id="app-view" tabindex="-1"></main>

    <button class="fab" id="fab" type="button" aria-label="Hızlı ekle" aria-expanded="false">
      <span class="fab-icon" aria-hidden="true">+</span>
    </button>

    <div class="quick-menu" id="quick-menu" hidden>
      <button type="button" data-quick="task"><span>✓</span> Görev ekle</button>
      <button type="button" data-quick="workout"><span>↗</span> Spor planla</button>
      <button type="button" data-quick="expense"><span>₺</span> Harcama ekle</button>
      <button type="button" data-quick="income"><span>＋</span> Gelir ekle</button>
      <button type="button" data-quick="sleep"><span>☾</span> Uyku kaydet</button>
    </div>

    <nav class="bottom-nav" aria-label="Ana menü">
      <button type="button" data-route="today" aria-selected="true"><span class="nav-icon" aria-hidden="true">☀</span><span>Bugün</span></button>
      <button type="button" data-route="calendar" aria-selected="false"><span class="nav-icon" aria-hidden="true">▦</span><span>Takvim</span></button>
      <button type="button" data-route="plans" aria-selected="false"><span class="nav-icon" aria-hidden="true">◫</span><span>Planlar</span></button>
      <button type="button" data-route="progress" aria-selected="false"><span class="nav-icon" aria-hidden="true">⌁</span><span>İlerleme</span></button>
    </nav>
  </div>

  <div class="sheet-backdrop" id="sheet-backdrop" hidden>
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet-grabber" aria-hidden="true"></div>
      <header class="sheet-header">
        <div>
          <p class="sheet-kicker" id="sheet-kicker"></p>
          <h2 id="sheet-title"></h2>
        </div>
        <button class="icon-button" id="sheet-close" type="button" aria-label="Kapat">×</button>
      </header>
      <div id="sheet-content"></div>
    </section>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <input id="backup-file" type="file" accept="application/json" hidden>

  <script src="./app.js" defer></script>
</body>
</html>
